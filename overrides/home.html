{% extends "main.html" %}

{% block tabs %}
{{ super() }}
{% if page.file.src_uri == "index.md" %}
<style>
  /* 隐藏 MkDocs 默认侧边栏，打造全屏体验 */
  .md-sidebar--primary,
  .md-sidebar--secondary,
  .md-main {
    display: none;
  }
  .md-header__title {
    display: block;
  }

  /* --- 核心容器 --- */
  .mdx-hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background-color: #1a1a1a; /* 图片加载前的背景色 */
  }

  /* --- 背景图片与动画 --- */
  .mdx-hero-image {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0; /* 初始隐藏，由JS控制淡入 */
    transition: opacity 1.2s ease-in-out, transform 20s linear;
    z-index: 0;
  }
  
  /* 图片加载后的类，用于触发微缩放动画 */
  .mdx-hero-image.loaded {
    opacity: 1;
    transform: scale(1.1);
  }

  /* --- 背景遮罩 (增强文字可读性) --- */
  .mdx-hero-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.6) 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* --- 毛玻璃卡片 (Glassmorphism 核心) --- */
  .glass-card {
    position: relative;
    z-index: 10;
    padding: 3.5rem 4rem;
    border-radius: 24px;
    text-align: center;
    max-width: 90%;
    width: 600px;
    
    /* 毛玻璃魔法 */
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 
      0 8px 32px 0 rgba(0, 0, 0, 0.3),
      inset 0 0 0 1px rgba(255, 255, 255, 0.05);
    
    /* 入场动画 */
    animation: floatUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    opacity: 0;
    transform: translateY(30px);
  }

  @keyframes floatUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- 排版 --- */
  .hero-title {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
    color: white;
    letter-spacing: -0.5px;
    /* 文字渐变光泽 */
    background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  .hero-subtitle {
    font-size: 1.1rem;
    color: rgba(255, 255, 255, 0.85);
    margin-bottom: 2.5rem;
    font-weight: 300;
    line-height: 1.5;
  }

  /* --- 按钮组 --- */
  .hero-buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .glass-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 28px;
    min-width: 160px;
    font-size: 0.95rem;
    font-weight: 500;
    color: white;
    text-decoration: none;
    border-radius: 50px;
    transition: all 0.3s ease;
    
    /* 按钮的毛玻璃背景 */
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(4px);
  }

  .glass-btn svg {
    width: 20px;
    height: 20px;
    fill: white;
    transition: transform 0.3s ease;
  }

  /* 悬停效果 */
  .glass-btn:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
    border-color: rgba(255, 255, 255, 0.4);
  }

  .glass-btn:hover svg {
    transform: scale(1.1);
  }

  /* 差异化 Repository 按钮 (增加一点强调色) */
  .glass-btn.repo:hover {
    background: rgba(110, 84, 148, 0.4); /* GitHub 紫色调 */
    box-shadow: 0 0 25px rgba(110, 84, 148, 0.5);
  }

  /* 移动端适配 */
  @media (max-width: 768px) {
    .glass-card {
      padding: 2rem;
      width: 85%;
    }
    .hero-title {
      font-size: 1.8rem;
    }
    .hero-buttons {
      flex-direction: column;
    }
    .glass-btn {
      width: 100%;
    }
  }
</style>

        </svg>
        Repository
      </a>
    </div>
  </div>
</section>

<script>
  // 保持原有的图片数量配置
  const imageCount = 6;
  const randomIndex = Math.floor(Math.random() * imageCount);
  const imageNumber = (randomIndex + 1).toString().padStart(2, '0');
  const randomImageSrc = `assets/wallpapers/${imageNumber}.jpg`;

  const heroImgElement = document.getElementById('hero-image');

  // 优化加载逻辑：只有当图片加载完毕后，才添加 .loaded 类来触发淡入动画
  const imgLoader = new Image();
  imgLoader.src = randomImageSrc;
  imgLoader.onload = function() {
    heroImgElement.src = randomImageSrc;
    // 稍微延迟一点点以确保 DOM 更新
    requestAnimationFrame(() => {
      heroImgElement.classList.add('loaded');
    });
  };

  // 预加载其他图片逻辑保持不变
  function preloadImages() {
    for (let i = 1; i <= imageCount; i++) {
      if (i === randomIndex + 1) continue; // 跳过当前已加载的
      const img = new Image();
      const num = i.toString().padStart(2, '0');
      img.src = `assets/wallpapers/${num}.jpg`;
    }
  }
  
  window.addEventListener('load', preloadImages);
</script>

{% endif %}
{% endblock %}
